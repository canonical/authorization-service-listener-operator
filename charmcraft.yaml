name: authorization-service-listener
type: charm
title: Charmed Authorization Service Listener
summary: Asynchronous event listener operator for Charmed Authorization Service
description: |
  A Charmed Operator managing asynchronous event ingestion from Apache Kafka
  and state synchronization for the Charmed Authorization Service.
links:
  documentation: https://canonical-identity.readthedocs-hosted.com
  issues: https://github.com/canonical/authorization-service-listener-operator/issues
  source: https://github.com/canonical/authorization-service-listener-operator
assumes:
  - k8s-api

containers:
  listener:
    resource: oci-image
resources:
  oci-image:
    type: oci-image
    description: OCI container image for Authorization Service workload
    upstream-source: ghcr.io/canonical/authorization-service:v2.0.3

requires:
  authorization-service-info:
    interface: authorization_service_info
    optional: false
  kafka:
    interface: kafka_client
    optional: false
  logging:
    interface: loki_push_api
    optional: true
  tracing:
    interface: tracing
    optional: true

provides:
  metrics-endpoint:
    interface: prometheus_scrape
    optional: true
  grafana-dashboard:
    interface: grafana_dashboard
    optional: true

config:
  options:
    log_level:
      type: string
      default: info
      description: |
        The verbosity of logs produced by the listener charm.
        Available values are: debug, info, warn, error.
    http_proxy:
      type: string
      description: URL of the HTTP proxy eg http://proxy.internal:6666, it will set the HTTP_PROXY var in the workload environment
    https_proxy:
      type: string
      description: URL of the HTTPS proxy eg http://proxy.internal:6666, it will set the HTTPS_PROXY var in the workload environment
    no_proxy:
      type: string
      description: Domains that need to be excluded from proxying no_proxy="test.com,test.co.uk", it is a comma separate list
    cpu:
      type: string
      description: |
        K8s cpu resource limit, e.g. "1" or "500m". Default is unset (no limit). This value is used
        for the "limits" portion of the resource requirements (the "requests" portion is
        automatically deduced from it).
        See https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
    memory:
      type: string
      description: |
        K8s memory resource limit, e.g. "1Gi". Default is unset (no limit). This value is used
        for the "limits" portion of the resource requirements (the "requests" portion is
        automatically deduced from it).
        See https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/

platforms:
  ubuntu@22.04:amd64:
  ubuntu@26.04:amd64:

parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
    build-packages:
      - git
